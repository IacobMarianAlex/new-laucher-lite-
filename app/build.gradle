plugins {
    id 'com.android.application'
}

android {
    namespace 'ro.lite.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'ro.lite.launcher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // semnat cu cheia de debug ca sa se poata instala direct
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Fara nicio biblioteca externa: aplicatia ramane foarte mica si usoara.
dependencies {
}
